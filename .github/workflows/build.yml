name: Build Windows Executable

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: 1. 코드를 가상머신에 체크아웃
        uses: actions/checkout@v4

      - name: 2. Python 3.10 설치
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 3. 의존성 라이브러리 설치
        run: |
          python -m pip install --upgrade pip
          if (Test-Path "defect_inspector/requirements.txt") {
              pip install -r defect_inspector/requirements.txt
          } elseif (Test-Path "requirements.txt") {
              pip install -r requirements.txt
          } else {
              pip install numpy opencv-python-headless Pillow scikit-learn joblib pandas openpyxl pyinstaller
          }
          pip install pyinstaller

      - name: 4. PyInstaller 빌드 실행
        run: |
          $target = "app.py"
          if (Test-Path "defect_inspector/app.py") {
              $target = "defect_inspector/app.py"
          }
          pyinstaller --noconfirm --onedir --windowed `
            --name "DefectInspector" `
            --hidden-import=openpyxl `
            --hidden-import=pandas `
            --hidden-import=sklearn `
            --hidden-import=cv2 `
            $target

      - name: 5. 빌드 결과물(EXE) 업로드
        uses: actions/upload-artifact@v4
        with:
          name: DefectInspector_Windows_x64
          path: dist/DefectInspector/
